ranges:
  - "203.0.113.0/24"
  - "198.51.100.0/24"

ports: "22,80,443,3389,3306,5432"

masscan_rate: 10000
masscan_workers: 8
masscan_wait: 1
masscan_hard_timeout: 1800

nmap_workers: 8
nmap_timeout: 120

notify:
  email:
    enabled: true
    smtp_host: "smtp.example.local"
    smtp_port: 587
    username: "scanner@example.local"
    password: "CHANGE_ME"
    from_addr: "scanner@example.local"
    to_addrs:
      - "security@example.local"

api_upload:
  enabled: false
  url: "https://api.example.local/report"
  timeout: 25
  verify_tls: true
  mark_sent: true

test_reports_dir: "/opt/netwatch/reports-test"
